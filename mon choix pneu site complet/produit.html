    *{box-sizing:border-box}body{margin:0;color:var(--white);background:radial-gradient(ellipse at 80% 0%,rgba(94,0,255,.2),transparent 32rem),radial-gradient(ellipse at 0% 45%,rgba(0,196,255,.09),transparent 28rem),var(--bg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}img{display:block;max-width:100%}a{color:inherit;text-decoration:none}button,input{font:inherit}.container{width:min(1120px,calc(100% - 36px));margin-inline:auto}.topbar{padding:10px 0;background:linear-gradient(100deg,var(--purple),#762bff 55%,var(--cyan));color:#090713}.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:14px}.topbar-text{font-size:.88rem;font-weight:800;letter-spacing:.04em}.topbar-actions{display:flex;flex-wrap:wrap;gap:8px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:6px 12px;border:1px solid rgba(9,7,19,.2);border-radius:12px;background:rgba(9,7,19,.88);color:white;font-size:.9rem;font-weight:800}header{position:sticky;z-index:10;top:0;border-bottom:1px solid var(--line);background:rgba(9,7,19,.94);backdrop-filter:blur(14px)}.nav{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:22px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{display:grid;place-items:center;width:48px;height:48px;border:2px solid var(--cyan);border-radius:15px;color:var(--cyan);font-size:.92rem;font-weight:1000;letter-spacing:.04em}.brand-name{display:flex;flex-direction:column;font-size:1.1rem;font-weight:1000;line-height:.98;letter-spacing:.08em}.brand-name .pneu{margin-top:4px;background:linear-gradient(90deg,var(--purple),#ff4fa3);background-clip:text;-webkit-background-clip:text;color:transparent;font-size:1.16rem;letter-spacing:.16em}.brand-tagline{margin-top:6px;color:var(--cyan);font-size:.65rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.nav-links{display:flex;align-items:center;gap:22px;color:var(--muted);font-size:.92rem}.nav-links a:hover,.foot margin:12px 0;color:var(--muted)}.inline-link{color:var(--cyan);text-decoration:underline}.breadcrumb{margin:0 0 20px;color:var(--muted);font-size:.92rem}.breadcrumb a{color:var(--cyan);text-decoration:underline}.back-link{display:inline-block;margin:0 0 18px;color:var(--cyan)}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
    @media(max-width:700px){.topbar-inner{flex-direction:column;text-align:center}.topbar-actions{justify-content:center}.container{width:min(100% - 26px,1120px)}.nav{min-height:70px;gap:10px}.nav-links{gap:8px}.brand-name{font-size:.88rem}.product-grid{grid-template-columns:1fr}.product-photo{min-height:210px}.product-specs{grid-template-columns:1fr 1fr}.shop-main{padding-top:28px}.footer-inner{flex-direction:column;justify-content:center;padding:16px 0;text-align:center}}

<body>
  <div class="topbar"><div class="container topbar-inner"><div class="topbar-text">Vente de pneus · Autres prestations à venir</div><div class="topbar-actions"><a class="button" href="/cdn-cgi/l/email-protection#563b3938353e393f2e26383323163923223a39393d7835393b">✉ E-mail</a><a class="button" href="tel:+33781960315">☎ Appeler</a><a class="button" href="https://www.google.com/maps/search/?api=1&query=10+rue+sous+Mouthier%2C+25111+Montgesoye" target="_blank" rel="noopener noreferrer">⌖ Nous trouver</a></div></div></div>
  <header><div class="container nav"><a class="brand" href="index.html#accueil" aria-label="Mon Choix Pneu — accueil"><span class="brand-mark" aria-hidden="true">MCP</span><span class="brand-name">MON CHOIX<span class="pneu">PNEU</span><span class="brand-tagline">Pneus à Montgesoye</span></span></a><nav class="nav-links" aria-label="Navigation principale"><a href="index.html#accueil">Accueil</a><a href="index.html#services">Nos services</a><a href="panier.html">🛒 Panier <span data-cart-count>0</span></a></nav></div></header>
  <main class="shop-main"><div class="shop-wrap"><div class="breadcrumb"><span id="crumb">Fiche produit</span></div><button class="history-back" type="button" onclick="if(history.length&gt;1)history.back();else location.href='index.html'">← Retour</button><div class="shop-kicker">Catalogue pneus · Montgesoye</div><h1 class="shop-title">Détail du pneu</h1><section id="product" class="shop-panel" aria-live="polite"><p class="shop-muted" role="status">Chargement du pneu…</p></section></div></main>
  <footer><div class="container footer-inner"><span>© <span id="year"></span> Mon Choix Pneu</span><span>10 rue sous Mouthier, 25111 Montgesoye</span></div></footer>
  <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script src="cart.js"></script><script src="images.js"></script><script src="supabase-config.js"></script><script src="search.js"></script><script>
  'use strict';
  const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const euro=x=>Number(x||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
  const id=new URLSearchParams(location.search).get('id'),target=document.getElementById('product');
  document.getElementById('year').textContent=new Date().getFullYear();
  async function getProduct(){
    const rows=await MCPSearch.load();
    const p=rows.find(x=>String(x.id)===String(id));
    if(!p){target.innerHTML='<h2>Pneu introuvable</h2><p class="shop-muted">Ce produit n’est pas disponible dans le catalogue.</p>';return;}
    document.title=[p.marque,p.modele].filter(Boolean).join(' ')+' | Mon Choix Pneu';
    document.getElementById('crumb').textContent=[p.marque,p.modele].filter(Boolean).join(' ');
    const profile=(()=>{const m=String(p.dimension||'').match(/\d{3}\s*[\/ -]\s*(\d{2,3})/);return m?m[1]:p.profil})();
    const specs=[['Dimension',p.dimension],['Profil',profile],['Indice de charge',p.indice_charge],['Indice de vitesse',p.indice_vitesse],['Saison',p.saison],['Étiquette UE',p.etiquette_ue],['Efficacité énergétique',p.ue_classe_efficacite_energetique],['Adhérence sur sol mouillé',p.ue_classe_adherence_mouillee],['Bruit externe',p.ue_bruit_externe_db?(p.ue_bruit_externe_db+' dB'):p.ue_classe_bruit_externe],['Neige sévère',p.ue_adherence_neige_severe],['Adhérence glace',p.ue_adherence_glace]].filter(x=>x[1]!==undefined&&x[1]!==null&&String(x[1]).trim()!=='');
    const stock=Math.max(0,Number(p.stock)||0),image=MCPImages.source(p);
    const description=['Pneu',p.marque,p.modele].filter(Boolean).join(' ')+' en dimension '+(p.dimension||'non renseignée')+'. Les caractéristiques disponibles dans le catalogue figurent ci-dessus. Contactez-nous pour confirmer le stock et demander un devis.';
    const mailBody=['Bonjour,','Je souhaite un devis et la confirmation de disponibilité pour ce pneu.','',`Pneu : ${[p.marque,p.modele].filter(Boolean).join(' ')}`,`Dimension : ${p.dimension||'non renseignée'}`,`Prix catalogue : ${euro(p.prix)} / pneu`,'','Merci de me recontacter.'].join('\n');
    const mail='mailto:monchoixpneu@outlook.com?subject='+encodeURIComponent('Demande de devis — '+[p.marque,p.modele].filter(Boolean).join(' '))+'&body='+encodeURIComponent(mailBody);
    target.innerHTML='<div class="product-grid"><div class="product-photo"><img id="product-image" src="'+esc(image)+'" alt="Pneu '+esc(p.marque)+' '+esc(p.modele)+'" loading="lazy"></div><div><div class="shop-kicker">'+esc(p.marque)+'</div><h2>'+esc(p.modele||'Pneu')+'</h2><div class="product-price">'+euro(p.prix)+' <small class="shop-muted">/ pneu</small></div><p class="stock-note">'+(stock>0?stock+' en stock':'Stock à confirmer')+'</p><p class="shop-muted">'+esc(description)+'</p><dl class="product-specs">'+specs.map(([k,v])=>'<div><dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd></div>').join('')+'</dl><div class="qty-row"><label for="qty">Quantité</label><input id="qty" type="number" min="1" max="'+Math.max(stock,1)+'" value="1" inputmode="numeric" '+(stock<1?'disabled':'')+'><button class="shop-button" id="add" type="button" '+(stock<1?'disabled':'')+'>Ajouter au panier</button></div><p id="feedback" class="status-message" aria-live="polite"></p><p><a class="inline-link" href="'+esc(mail)+'">✉ Demander un devis par e-mail</a></p></div></div>';
    document.getElementById('product-image').addEventListener('error',function(){this.onerror=null;this.src=MCPImages.placeholder;this.alt='Photo non disponible';});
    document.getElementById('add').addEventListener('click',()=>{const input=document.getElementById('qty'),qty=Math.max(1,Math.min(stock,parseInt(input.value,10)||1));MCPCart.add(p,qty);document.getElementById('feedback').textContent=qty+' pneu(s) ajouté(s) au panier.';MCPCart.updateBadges();});
  }
  if(id){getProduct().catch(error=>{console.error('Chargement de la fiche impossible.',error);target.innerHTML='<h2>Fiche momentanément indisponible</h2><p class="shop-muted">Le catalogue ne peut pas être chargé. Réessayez dans quelques instants.</p>';});}
  else target.innerHTML='<h2>Produit non précisé</h2><p class="shop-muted">Ouvrez cette page depuis les résultats du catalogue.</p>';
  </script>
